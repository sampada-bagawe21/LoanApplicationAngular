
<form #loanForm="ngForm" (ngSubmit)="applyforLoan(loanForm.value)">

  <div class="form-group mb-3">
    <label>Loan Type</label>
    <select class="form-control" name="loanType" ngModel>
      <option value="">Select Loan Type</option>
      <option value="Home Loan">Home Loan</option>
      <option value="Personal Loan">Personal Loan</option>
      <option value="Car Loan">Education Loan</option>
    </select>
  </div>

  <div class="form-group mb-3">
    <label>Loan Amount</label>
    <input type="number" class="form-control"name="loanAmount" ngModel
      placeholder="Enter Loan Amount" required>
  </div>

  <div class="form-group mb-3">
    <label>Tenure (Years)</label>
    <select class="form-control" name="tenureYears" ngModel required>
      <option [ngValue]="3">3 Years</option>
      <option [ngValue]="5">5 Years</option>
      <option [ngValue]="6">6 Years</option>
      <option [ngValue]="10">10 Years</option>
    </select>
  </div>

  <div class="form-group mb-3">
    <label>Bank Name</label>
    <input type="text" class="form-control"
      name="bankName" ngModel placeholder="Enter Bank Name" required>
  </div>

  <div class="form-group mb-3">
    <label>Bank Account Number</label>
    <input type="text" class="form-control"
      name="bankAccountNumber" ngModel
      placeholder="Enter Account Number" required>
  </div>

  <div class="form-group mb-3">
    <label>IFSC Code</label>
    <input type="text" class="form-control" name="ifscCode" ngModel placeholder="Enter IFSC Code" required>
  </div>

  <div class="form-group mb-3">
    <label>EMI Days</label>
    <select class="form-control" name="emiDay" ngModel required>
      <option [ngValue]="1">1 </option>
      <option [ngValue]="5">5 </option>
      <option [ngValue]="6">6 </option>
      <option [ngValue]="10">10</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">
    Apply Loan
  </button>

</form>
